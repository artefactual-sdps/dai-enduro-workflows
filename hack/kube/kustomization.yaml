apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: enduro-sdps
resources:
  - pvc.yaml
  - worker.yaml
secretGenerator:
  - name: dai-enduro-secret
    files:
      - dai-enduro-worker.toml
      - allowed_file_formats.csv
      - dai-relaxed-schema.csvs
    options:
      disableNameSuffixHash: true
